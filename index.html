<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Disponibilidad de citas</title>
<style>
  :root {
    --azul: #1a73e8;
    --verde: #28a745;
    --rojo: #dc3545;
    --ocupado: #3f6ad8;
    --fondo: #f5f5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: #333;
  }
  .header {
    background: var(--azul);
    color: #fff;
    padding: 28px 16px 22px;
    text-align: center;
  }
  .header h1 { margin: 0; font-size: 22px; }
  .header p { margin: 4px 0 0; color: #dce8ff; font-size: 14px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 16px; }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-nav button {
    background: var(--azul);
    border: none;
    color: #fff;
    border-radius: 8px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
  }
  .cal-nav button:disabled { opacity: 0.4; cursor: default; }
  .cal-title { font-weight: 700; font-size: 15px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dia-sem { font-size: 11px; color: #888; text-transform: capitalize; text-align: center; padding: 4px 0; }
  .cal-dia {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    background: #fafafa;
  }
  .cal-dia:hover { background: #e8f0fe; }
  .cal-dia.seleccionado { background: var(--azul); color: #fff; font-weight: 600; }
  .cal-dia.hoy { outline: 2px solid var(--azul); outline-offset: -2px; }
  .cal-dia.pasado { color: #ccc; cursor: default; background: #fafafa; }
  .cal-dia.vacio { background: transparent; cursor: default; }

  .leyenda { display: flex; justify-content: space-around; gap: 8px; flex-wrap: wrap; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

  .slot { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .slot-time { width: 46px; font-size: 13px; font-weight: 600; color: #555; }
  .slot-bar {
    flex: 1;
    border-radius: 6px;
    padding: 8px 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .libre { background: var(--verde); }
  .libre.solicitable { cursor: pointer; border: 2px solid #1d7a37; }
  .libre.solicitable:hover { background: #218838; }
  .ocupado { background: var(--ocupado); }
  .restringido { background: var(--rojo); }

  .alerta {
    background: #fdecea;
    border: 1px solid #f5c6cb;
    border-radius: 10px;
    padding: 12px;
    color: #a71d2a;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .estado {
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 8px;
  }
  .btn-recargar {
    width: 100%;
    background: #fff;
    border: 1px solid var(--azul);
    color: var(--azul);
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .foot-note { text-align: center; color: #999; font-size: 11px; margin: 12px 0 24px; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal[hidden] { display: none; }
  .modal-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 18px; color: #333; }
  .modal-sub { margin: 0 0 14px; font-size: 14px; color: #1a73e8; font-weight: 600; }
  .modal-card label { display: block; font-size: 13px; color: #666; margin: 8px 0 4px; }
  .modal-card input,
  .modal-card textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  .modal-card textarea { min-height: 70px; resize: vertical; }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .modal-btns button {
    flex: 1;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  #modalEnviar { background: var(--verde); color: #fff; }
  #modalEnviar:disabled { background: #9ad0a8; cursor: default; }
  #modalCerrarOk { background: var(--azul); color: #fff; display: none; }
  #modalCancelar { background: #fff; color: #555; border: 1px solid #ccc; }
  .modal-msg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
  .modal-msg.ok { background: #e6f4ea; color: #1d7a37; }
  .modal-msg.err { background: #fdecea; color: #a71d2a; }
</style>
</head>
<body>
  <div class="header">
<h1>Disponibilidad de citas</h1>
      <p id="headerSub">Consulta los horarios libres y toca uno para solicitarlo</p>
  </div>

  <div class="wrap">
    <div id="alerta" class="alerta" hidden></div>
    <div id="estado" class="estado">Cargando horarios…</div>

    <div class="card">
      <h2>Elige un día</h2>
      <div class="cal-nav">
        <button id="prevMes" aria-label="Mes anterior">‹</button>
        <span class="cal-title" id="tituloMes"></span>
        <button id="nextMes" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card leyenda">
      <span><span class="dot" style="background:var(--verde)"></span> Libre</span>
      <span><span class="dot" style="background:var(--ocupado)"></span> Ocupado</span>
      <span><span class="dot" style="background:var(--rojo)"></span> Restringido</span>
    </div>

    <div class="card">
      <h2 id="tituloDia">Selecciona una fecha</h2>
      <div id="slots"></div>
    </div>

    <button class="btn-recargar" id="recargar">↻ Actualizar horarios</button>
    <p class="foot-note">Actualización automática cada 60 segundos · Toca un horario en verde para solicitarlo</p>
  </div>

  <div id="modalSolicitud" class="modal" hidden>
    <div class="modal-card">
      <h3>Solicitar cita</h3>
      <p class="modal-sub" id="modalSub"></p>

      <label for="fNombre">Tu nombre *</label>
      <input id="fNombre" type="text" placeholder="Nombre y apellido" maxlength="80" />

      <label for="fTelefono">Teléfono</label>
      <input id="fTelefono" type="tel" placeholder="Teléfono de contacto" maxlength="30" />

      <label for="fEmail">Correo electrónico</label>
      <input id="fEmail" type="email" placeholder="correo@ejemplo.com" maxlength="80" autocomplete="email" />

      <label for="fComentario">Descripción del trabajo</label>
      <textarea id="fComentario" placeholder="Breve descripción de lo que necesitas" maxlength="500"></textarea>

      <div class="modal-msg" id="modalMsg"></div>

      <div class="modal-btns">
        <button id="modalCancelar">Cancelar</button>
        <button id="modalEnviar">Enviar solicitud</button>
        <button id="modalCerrarOk">Cerrar</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var BASE = 'https://kairos-112e3-default-rtdb.firebaseio.com';
  var CITAS_URL = BASE + '/citas.json';
  var REST_URL = BASE + '/restricciones.json';
  var SOLICITUDES_URL = BASE + '/solicitudes.json';
  var SLOT_MIN = 30;
  var HORA_INICIO = 7;
  var HORA_FIN = 19;

  var citas = [];
  var restricciones = [];
  var cargado = false;
  var fechaSel = null;
  var hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  var vistaAnio = hoy.getFullYear();
  var vistaMes = hoy.getMonth();

  var params = new URLSearchParams(window.location.search);
  var clienteParam = (params.get('cliente') || '').trim();

  var alertaEl = document.getElementById('alerta');
  var estadoEl = document.getElementById('estado');
  var headerSubEl = document.getElementById('headerSub');
  var tituloMesEl = document.getElementById('tituloMes');
  var calGridEl = document.getElementById('calGrid');
  var tituloDiaEl = document.getElementById('tituloDia');
  var slotsEl = document.getElementById('slots');
  var prevBtn = document.getElementById('prevMes');
  var nextBtn = document.getElementById('nextMes');
  var recargarBtn = document.getElementById('recargar');

  var modalEl = document.getElementById('modalSolicitud');
  var modalSubEl = document.getElementById('modalSub');
  var fNombreEl = document.getElementById('fNombre');
  var fTelefonoEl = document.getElementById('fTelefono');
  var fEmailEl = document.getElementById('fEmail');
  var fComentarioEl = document.getElementById('fComentario');
  var modalMsgEl = document.getElementById('modalMsg');
  var modalEnviarEl = document.getElementById('modalEnviar');
  var modalCancelarEl = document.getElementById('modalCancelar');
  var modalCerrarOkEl = document.getElementById('modalCerrarOk');

  var solicitando = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function toKey(h, m) { return pad(h) + ':' + pad(m); }

  function slotMin(slot) {
    var p = slot.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function diaSemanaFromFecha(fecha) {
    var p = fecha.split('-');
    return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getDay();
  }

  function fechaStr(y, m, d) {
    return y + '-' + pad(m) + '-' + pad(d);
  }

  function esRestringido(slot, fecha) {
    if (!restricciones.length) return false;
    var min = slotMin(slot);
    var minFin = min + SLOT_MIN;
    var dia = diaSemanaFromFecha(fecha);
    return restricciones.some(function (r) {
      return r && Array.isArray(r.dias) && r.dias.indexOf(dia) !== -1 &&
             r.horaInicio && r.horaFin &&
             min < slotMin(r.horaFin) && minFin > slotMin(r.horaInicio);
    });
  }

  function slotOcupado(slot, fecha) {
    var ocupado = false;
    citas.forEach(function (c) {
      var cd = c.data;
      if (!cd || cd.fecha !== fecha || !cd.hora) return;
      var start = slotMin(cd.hora);
      var end = start + (cd.tiempoMinutos || SLOT_MIN);
      var s = slotMin(slot);
      var sEnd = s + SLOT_MIN;
      if (s < end && sEnd > start) ocupado = true;
    });
    return ocupado;
  }

  function llamar(url, metodo, cuerpo) {
    var opciones = {
      method: metodo || 'GET'
    };
    if (cuerpo) {
      opciones.headers = { 'Content-Type': 'application/json' };
      opciones.body = JSON.stringify(cuerpo);
    }
    return fetch(url, opciones).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function enviarCorreoWeb(cuerpo, orderId) {
    if (!cuerpo.email) return Promise.resolve(false);
    return fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: 'service_ny758rb',
        template_id: 'template_wxrwbei',
        user_id: 'tanIfJ_dm4fuds-bM',
        template_params: {
          to_email: cuerpo.email,
          to_name: cuerpo.nombre,
          fecha: cuerpo.fecha,
          hora: cuerpo.hora,
          mensaje: cuerpo.comentario || '',
          order_id: orderId
        }
      })
    }).then(function (res) { return res.ok; })
      .catch(function () { return false; });
  }

  function cargarDatos() {
    if (clienteParam) {
      headerSubEl.textContent = 'Hola ' + clienteParam + ', elige el horario que más te convenga.';
    }
    estadoEl.textContent = 'Cargando horarios…';
    Promise.all([llamar(CITAS_URL), llamar(REST_URL)])
      .then(function (results) {
        citas = [];
        if (results[0]) {
          Object.keys(results[0]).forEach(function (id) {
            citas.push({ id: id, data: results[0][id] });
          });
        }
        restricciones = [];
        if (results[1]) {
          Object.keys(results[1]).forEach(function (id) {
            restricciones.push({ id: id, data: results[1][id] });
          });
        }
        cargado = true;
        alertaEl.hidden = true;
        estadoEl.textContent = '';
        pintarMes();
        pintarDia();
      })
      .catch(function (e) {
        cargado = false;
        estadoEl.textContent = '';
        alertaEl.hidden = false;
        alertaEl.textContent = 'No se pudieron cargar los horarios: ' + (e && e.message ? e.message : e) +
          '. Revisa que las reglas de la base de datos permitan lectura pública.';
      });
  }

  function pintarMes() {
    var primerDia = new Date(vistaAnio, vistaMes, 1);
    tituloMesEl.textContent =
      primerDia.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });

    var anioSel = primerDia.getFullYear();
    var mesSel = primerDia.getMonth();
    var diasEnMes = new Date(anioSel, mesSel + 1, 0).getDate();
    var offset = primerDia.getDay();

    var html = '';
    ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].forEach(function (d) {
      html += '<div class="cal-dia-sem">' + d + '</div>';
    });

    for (var i = 0; i < offset; i++) {
      html += '<div class="cal-dia vacio"></div>';
    }
    for (var dia = 1; dia <= diasEnMes; dia++) {
      var fecha = fechaStr(anioSel, mesSel + 1, dia);
      var dFecha = new Date(anioSel, mesSel, dia);
      var esPasado = dFecha < hoy;
      var esHoy = dFecha.getTime() === hoy.getTime();
      var esSel = fecha === fechaSel;
      var cls = 'cal-dia';
      if (esPasado) cls += ' pasado';
      if (esHoy) cls += ' hoy';
      if (esSel) cls += ' seleccionado';
      html += '<div class="' + cls + '" data-fecha="' + fecha + '">' + dia + '</div>';
    }
    calGridEl.innerHTML = html;

    prevBtn.disabled = vistaAnio === hoy.getFullYear() && vistaMes === hoy.getMonth();

    calGridEl.querySelectorAll('.cal-dia[data-fecha]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (el.classList.contains('pasado')) return;
        fechaSel = el.getAttribute('data-fecha');
        pintarMes();
        pintarDia();
      });
    });
  }

  function formatDia(fecha) {
    var p = fecha.split('-');
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    var txt = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return txt.charAt(0).toUpperCase() + txt.slice(1);
  }

  function pintarDia() {
    if (!fechaSel) {
      tituloDiaEl.textContent = 'Selecciona una fecha';
      slotsEl.innerHTML = '<div class="estado">Toca un día en el calendario para ver la disponibilidad.</div>';
      return;
    }
    tituloDiaEl.textContent = 'Horarios del ' + formatDia(fechaSel);

    var slots = [];
    for (var h = HORA_INICIO; h < HORA_FIN; h++) {
      slots.push(toKey(h, 0));
      slots.push(toKey(h, 30));
    }

    var html = '';
    slots.forEach(function (slot) {
      var ocupado = slotOcupado(slot, fechaSel);
      var tipo = 'libre';
      var texto = 'Libre';
      if (esRestringido(slot, fechaSel)) {
        tipo = 'restringido';
        texto = 'Restringido';
      } else if (ocupado) {
        tipo = 'ocupado';
        texto = 'Ocupado';
      }
      html += '<div class="slot"><span class="slot-time">' + slot + '</span>' +
              '<span class="slot-bar ' + tipo + (tipo === 'libre' ? ' solicitable' : '') + '" data-slot="' + slot + '">' + texto + '</span></div>';
    });

    var anuncio = '';
    if (!citas.some(function (c) { return c.data && c.data.fecha === fechaSel; })) {
      anuncio = '<div class="estado">Sin citas registradas: el día está libre.</div>';
    }
    slotsEl.innerHTML = anuncio + html;

    slotsEl.querySelectorAll('.solicitable').forEach(function (el) {
      el.addEventListener('click', function () {
        abrirSolicitud(fechaSel, el.getAttribute('data-slot'));
      });
    });
  }

  function abrirSolicitud(fecha, slot) {
    if (slotOcupado(slot, fecha) || esRestringido(slot, fecha)) return;
    solicitando = { fecha: fecha, slot: slot };
    modalSubEl.textContent = formatDia(fecha) + ' · ' + slot;
    fNombreEl.value = clienteParam || '';
    fTelefonoEl.value = '';
    fEmailEl.value = '';
    fComentarioEl.value = '';
    modalMsgEl.className = 'modal-msg';
    modalMsgEl.textContent = '';
    modalMsgEl.style.display = 'none';
    modalEnviarEl.style.display = '';
    modalCancelarEl.style.display = '';
    modalCerrarOkEl.style.display = 'none';
    modalEnviarEl.disabled = false;
    modalEl.hidden = false;
    setTimeout(function () { fNombreEl.focus(); }, 100);
  }

  function mostrarMsg(tipo, texto) {
    modalMsgEl.className = 'modal-msg ' + tipo;
    modalMsgEl.textContent = texto;
    modalMsgEl.style.display = 'block';
  }

  function cerrarModal() {
    modalEl.hidden = true;
    solicitando = null;
  }

  function enviarSolicitud() {
    var nombre = fNombreEl.value.trim();
    if (!solicitando) return;
    if (!nombre) {
      mostrarMsg('err', 'Escribe tu nombre para poder contactarte.');
      return;
    }
    if (slotOcupado(solicitando.fecha, solicitando.slot) || esRestringido(solicitando.fecha, solicitando.slot)) {
      mostrarMsg('err', 'Ese horario ya no está disponible. Elige otro.');
      return;
    }
    modalEnviarEl.disabled = true;
    var cuerpo = {
      nombre: nombre,
      telefono: fTelefonoEl.value.trim(),
      email: fEmailEl.value.trim(),
      comentario: fComentarioEl.value.trim(),
      fecha: solicitando.fecha,
      hora: solicitando.slot,
      creado: new Date().toISOString()
    };
    var orderId = '';
    llamar(SOLICITUDES_URL, 'POST', cuerpo)
      .then(function (resp) {
        if (resp && resp.name) {
          orderId = String(resp.name).replace(/-/g, '').slice(0, 8).toUpperCase();
        }
        return enviarCorreoWeb(cuerpo, orderId);
      })
      .then(function (correoOk) {
        modalEnviarEl.style.display = 'none';
        modalCancelarEl.style.display = 'none';
        modalCerrarOkEl.style.display = '';
        var msg;
        if (cuerpo.email && correoOk) {
          msg = '¡Solicitud enviada, folio #' + orderId + '! Te enviamos un correo de confirmación a ' + cuerpo.email + '.';
        } else {
          msg = '¡Solicitud enviada! Te vamos a contactar para confirmar la cita de ' + solicitando.slot + '.';
        }
        mostrarMsg('ok', msg);
        setTimeout(cerrarModal, 2500);
      })
      .catch(function (e) {
        modalEnviarEl.disabled = false;
        mostrarMsg('err', 'No se pudo enviar la solicitud: ' + (e && e.message ? e.message : e));
      });
  }

  modalEnviarEl.addEventListener('click', enviarSolicitud);
  modalCancelarEl.addEventListener('click', cerrarModal);
  modalCerrarOkEl.addEventListener('click', cerrarModal);
  modalEl.addEventListener('click', function (e) {
    if (e.target === modalEl && !modalEnviarEl.disabled) cerrarModal();
  });

  prevBtn.addEventListener('click', function () {
    vistaMes--;
    if (vistaMes < 0) { vistaMes = 11; vistaAnio--; }
    pintarMes();
    pintarDia();
  });
  nextBtn.addEventListener('click', function () {
    vistaMes++;
    if (vistaMes > 11) { vistaMes = 0; vistaAnio++; }
    pintarMes();
    pintarDia();
  });
  recargarBtn.addEventListener('click', cargarDatos);

  cargarDatos();
  setInterval(cargarDatos, 60000);
})();
</script>
</body>
</html>
